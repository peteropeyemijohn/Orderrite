# Checks every push and pull request. Uses no real secrets: there are none in
# GitHub, and the tests use in-memory fakes instead of a real database.
name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow can only read the code, never change the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Install, secret scan, type check, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Every action is pinned to an exact commit (a tag can be moved; a commit cannot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-secrets --all
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds both images and starts Postgres, the migrate job and the API
      # with the fake values from docker-compose.yml.
      - run: docker compose up --build --detach
      - name: Wait until the API and its database answer
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4000/health && exit 0
            sleep 2
          done
          echo "The API did not become healthy in time"; exit 1
      - name: Check the seeded data, the non-root user and the image settings
        run: |
          curl -fsS http://localhost:4000/config/public | grep -q '"Akure"'
          test "$(docker compose exec -T api id -u)" != "0"
          docker image inspect orderrite-api --format 'Image size: {{.Size}} bytes. Env: {{json .Config.Env}}'
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down --volumes
